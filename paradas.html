<style>
/* Buscador arriba, la parada elegida debajo y, al final, las tres más cercanas: como un panel de marquesina por parada. */
:root {
  --bg: #eef1f6;
  --surface: #ffffff;
  --ink: #101a2b;
  --muted: #5a667c;
  --rule: #d8deea;
  --accent: #135fcb;
  --ok: #17803f;
  --late: #a8590a;
  --bad: #b42318;
  --alert-bg: #fff4e5;
  --alert-ink: #6b3a00;
  --font-display: "Barlow Condensed", "Roboto Condensed", "Arial Narrow", sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b111c; --surface: #131c2c; --ink: #e9eef8; --muted: #9aa6bd; --rule: #263248;
    --accent: #5d9bff; --ok: #4cc27a; --late: #f0a94b; --bad: #ff7a6b; --alert-bg: #2a1f10; --alert-ink: #f6d3a2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b111c; --surface: #131c2c; --ink: #e9eef8; --muted: #9aa6bd; --rule: #263248;
  --accent: #5d9bff; --ok: #4cc27a; --late: #f0a94b; --bad: #ff7a6b; --alert-bg: #2a1f10; --alert-ink: #f6d3a2;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 17px/1.45 var(--font-body);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
.wrap {
  max-width: 32rem; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 28px;
  display: flex; flex-direction: column; gap: 14px;
}
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { margin: 0; font: 700 1.9rem/1 var(--font-display); }
h2 { margin: 0; font: 700 1.35rem/1.1 var(--font-display); }
a { color: var(--accent); }
.back { font-weight: 600; text-decoration: none; }
.back:hover { text-decoration: underline; }

.search { position: relative; }
.search label { display: block; font-size: .8rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 4px; }
.search-row { display: flex; gap: 8px; }
input[type="search"] {
  flex: 1; min-width: 0; font: 500 1.1rem var(--font-body); color: var(--ink); background: var(--surface);
  border: 1.5px solid var(--rule); border-radius: 12px; padding: 12px 14px;
}
input[type="search"]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
button {
  font: 600 .95rem/1 var(--font-body); color: var(--accent); background: transparent;
  border: 1.5px solid var(--accent); border-radius: 10px; padding: 10px 14px; cursor: pointer;
}
button:disabled { opacity: .55; cursor: default; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.suggest { list-style: none; margin: 6px 0 0; padding: 0; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; }
.suggest li + li { border-top: 1px solid var(--rule); }
.sug {
  width: 100%; text-align: left; border: 0; border-radius: 0; color: var(--ink); font: 400 1rem/1.3 var(--font-body);
  padding: 11px 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px;
}
.sug b { font-variant-numeric: tabular-nums; }
.sug:hover, .sug:focus-visible { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.sug-lines { display: inline-flex; gap: 4px; }
.sug-to { color: var(--muted); font-size: .9rem; flex-basis: 100%; }

.badge {
  display: inline-grid; place-items: center; min-width: 1.9rem; height: 1.6rem; padding: 0 .35rem; border-radius: 6px;
  font: 700 1rem/1 var(--font-display); flex: none;
}

.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 16px; padding: 14px 16px 10px; display: flex; flex-direction: column; gap: 8px; }
.card.stop { border-top: 6px solid var(--accent); }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.card-head p { margin: 2px 0 0; color: var(--muted); font-size: .95rem; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
.card-head b { color: var(--ink); font-variant-numeric: tabular-nums; }
.close { padding: 6px 10px; font-size: .9rem; flex: none; }

.rows { list-style: none; margin: 0; padding: 0; }
.row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; padding: 9px 0; }
.row + .row { border-top: 1px solid var(--rule); }
.row-main { min-width: 0; display: flex; flex-direction: column; }
.row-dest { font-weight: 600; overflow-wrap: anywhere; }
.row-sub { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
.row-min { font: 700 1.45rem/1 var(--font-display); font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.row-min.now { color: var(--ok); }
.row.dead .row-dest, .row.dead .row-min { text-decoration: line-through; color: var(--muted); }
.st.ok { color: var(--ok); }
.st.late { color: var(--late); }
.st.bad { color: var(--bad); }
.none { color: var(--muted); padding: 10px 0; list-style: none; }

.near-section { display: flex; flex-direction: column; gap: 10px; }
.near-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.near-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.near {
  position: relative; color: var(--ink); background: var(--surface); border: 1px solid var(--rule);
  border-radius: 16px; padding: 12px 16px 6px; display: flex; flex-direction: column; gap: 4px;
}
.near:hover { border-color: var(--accent); }
.near-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.near-name { font: 700 1.2rem/1.15 var(--font-display); overflow-wrap: anywhere; color: var(--ink); background: none; border: 0; border-radius: 0; padding: 0; text-align: left; }
/* Toda la tarjeta es el botón: la capa ::after cubre la tarjeta, así que el clic siempre cae en el botón aunque las filas se repinten. */
.near-name::after { content: ""; position: absolute; inset: 0; border-radius: 16px; }
.near-name:focus-visible { outline: none; }
.near-name:focus-visible::after { outline: 3px solid var(--accent); outline-offset: 2px; }
#stop-lines { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.near-dist { color: var(--accent); font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.near-meta { color: var(--muted); font-size: .9rem; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
.near-meta b { color: var(--ink); }
.msg { margin: 0; color: var(--muted); }

.alert { background: var(--alert-bg); color: var(--alert-ink); border-radius: 12px; padding: 10px 14px; overflow-wrap: anywhere; }
.alert p { margin: 0; }
.alert-h { font-weight: 600; }
.alert-t { font-size: .92rem; }

.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.status { color: var(--muted); font-size: .85rem; margin: 0; min-width: 0; flex: 1 1 12rem; }
.stale { color: var(--late); font-weight: 600; }
.error { margin: 0; border-radius: 12px; padding: 10px 14px; font-size: .92rem; background: var(--surface); border: 1px solid var(--bad); }
.foot { color: var(--muted); font-size: .8rem; margin: 0; }
</style>
</head>

<script>// Núcleo sin DOM: horario GTFS compacto, decodificador GTFS-Realtime y cálculo de llegadas.
// Se usa tal cual en el navegador (global BusCore) y en Node (module.exports) para el build y los tests.
var BusCore = (function () {
  "use strict";
  var TZ = "Europe/Madrid";

  // ---------- CSV ----------
  function splitQuoted(line) {
    var out = [], field = "", q = false;
    for (var i = 0; i < line.length; i++) {
      var c = line[i];
      if (q) {
        if (c === '"') { if (line[i + 1] === '"') { field += '"'; i++; } else q = false; }
        else field += c;
      } else if (c === '"') q = true;
      else if (c === ",") { out.push(field); field = ""; }
      else field += c;
    }
    out.push(field);
    return out;
  }
  function parseCSV(text) {
    if (!text) return [];
    if (text.charCodeAt(0) === 0xfeff) text = text.slice(1);
    var lines = text.split("\n"), rows = [], head = null;
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      if (line.charCodeAt(line.length - 1) === 13) line = line.slice(0, -1);
      // Campo entrecomillado con salto de línea dentro: juntar con la siguiente línea.
      while (line.split('"').length % 2 === 0 && i + 1 < lines.length) line += "\n" + lines[++i].replace(/\r$/, "");
      if (line === "") continue;
      var cells = line.indexOf('"') < 0 ? line.split(",") : splitQuoted(line);
      if (!head) { head = cells.map(function (h) { return h.trim(); }); continue; }
      var o = {};
      for (var k = 0; k < head.length; k++) o[head[k]] = cells[k] === undefined ? "" : cells[k].trim();
      rows.push(o);
    }
    return rows;
  }

  function hms(s) {
    if (!s) return null;
    var m = /^\s*(\d+):(\d{2}):(\d{2})\s*$/.exec(s);
    return m ? (+m[1]) * 3600 + (+m[2]) * 60 + (+m[3]) : null;
  }

  // ---------- Horario compacto a partir del GTFS ----------
  // get(nombre) devuelve el texto de un fichero del zip o null.
  function deriveSchedule(get) {
    function req(n) { var t = get(n); if (t == null) throw new Error("El GTFS no trae " + n); return t; }
    var routes = {};
    parseCSV(req("routes.txt")).forEach(function (r) {
      routes[r.route_id] = [r.route_short_name || r.route_id, r.route_long_name || "", (r.route_color || "").replace("#", "")];
    });
    var allStops = {};
    parseCSV(req("stops.txt")).forEach(function (s) {
      allStops[s.stop_id] = [s.stop_name, +(+s.stop_lat).toFixed(6), +(+s.stop_lon).toFixed(6)];
    });
    var dates = {};
    function add(d, s) { (dates[d] = dates[d] || {})[s] = 1; }
    var cal = get("calendar.txt");
    if (cal) parseCSV(cal).forEach(function (c) {
      var days = ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"];
      var d = new Date(Date.UTC(+c.start_date.slice(0, 4), +c.start_date.slice(4, 6) - 1, +c.start_date.slice(6, 8)));
      var end = Date.UTC(+c.end_date.slice(0, 4), +c.end_date.slice(4, 6) - 1, +c.end_date.slice(6, 8));
      for (; d.getTime() <= end; d.setUTCDate(d.getUTCDate() + 1)) {
        if (c[days[d.getUTCDay()]] === "1") add(d.toISOString().slice(0, 10).replace(/-/g, ""), c.service_id);
      }
    });
    var cd = get("calendar_dates.txt");
    if (cd) parseCSV(cd).forEach(function (c) {
      if (c.exception_type === "1") add(c.date, c.service_id);
      else if (c.exception_type === "2" && dates[c.date]) delete dates[c.date][c.service_id];
    });
    var trips = {};
    parseCSV(req("trips.txt")).forEach(function (t) { trips[t.trip_id] = t; });
    var byTrip = {};
    parseCSV(req("stop_times.txt")).forEach(function (st) {
      if (!trips[st.trip_id]) return;
      (byTrip[st.trip_id] = byTrip[st.trip_id] || []).push(st);
    });
    var patterns = [], pIndex = {}, svcTrips = {}, usedStops = {};
    Object.keys(byTrip).forEach(function (tid) {
      var sts = byTrip[tid].sort(function (a, b) { return a.stop_sequence - b.stop_sequence; });
      var times = sts.map(function (s) { return hms(s.arrival_time) != null ? hms(s.arrival_time) : hms(s.departure_time); });

      times.forEach(function (t, i) { if (t != null) known.push(i); });

        var a = null, b = null;
        for (var k = 0; k < known.length; k++) { if (known[k] < i) a = known[k]; else if (b == null) b = known[k]; }

        else times[i] = Math.round(times[a] + (times[b] - times[a]) * (i - a) / (b - a));
      }
      var t0 = hms(sts[0].departure_time) != null ? hms(sts[0].departure_time) : times[0];
      var ids = sts.map(function (s) { usedStops[s.stop_id] = 1; return s.stop_id; });
      var seqs = sts.map(function (s) { return +s.stop_sequence; });
      var contiguous = seqs.every(function (v, i) { return v === i + 1; });
      var offs = times.map(function (t) { return t - t0; });
      var tr = trips[tid], dir = +(tr.direction_id || 0);
      var key = [tr.route_id, dir, tr.trip_headsign || "", ids.join(","), seqs.join(","), offs.join(",")].join("|");
      var pi = pIndex[key];
      if (pi === undefined) {
        pi = pIndex[key] = patterns.length;
        patterns.push([tr.route_id, dir, tr.trip_headsign || "", ids, offs, contiguous ? 0 : seqs]);
      }
      (svcTrips[tr.service_id] = svcTrips[tr.service_id] || []).push([pi, t0]);
    });
    var stops = {};
    Object.keys(usedStops).forEach(function (id) { if (allStops[id]) stops[id] = allStops[id]; });
    var outDates = {};
    Object.keys(dates).sort().forEach(function (d) {
      var s = Object.keys(dates[d]).filter(function (x) { return svcTrips[x]; });
      if (s.length) outDates[d] = s;
    });
    var fi = parseCSV(get("feed_info.txt") || "")[0] || {};
    var dl = Object.keys(outDates);
    return {
      v: 1,
      feed: { start: fi.feed_start_date || dl[0] || "", end: fi.feed_end_date || dl[dl.length - 1] || "", version: fi.feed_version || "" },
      routes: routes, stops: stops, patterns: patterns, trips: svcTrips, dates: outDates
    };
  }

  function weekday(yyyymmdd) { return new Date(Date.UTC(+yyyymmdd.slice(0, 4), +yyyymmdd.slice(4, 6) - 1, +yyyymmdd.slice(6, 8))).getUTCDay(); }
  // Deja solo los viajes de una línea y sentido que paran en una parada (la página es para una sola parada).
  function filterSchedule(sched, cfg) {
    var map = {}, patterns = [], trips = {}, dates = {}, stops = {}, routes = {};
    sched.patterns.forEach(function (p, i) {
      if (p[0] === cfg.route && p[1] === cfg.dir && p[3].indexOf(cfg.stop) >= 0) {
        map[i] = patterns.length; patterns.push(p);
        p[3].forEach(function (s) { if (sched.stops[s]) stops[s] = sched.stops[s]; });
      }
    });
    Object.keys(sched.trips).forEach(function (svc) {
      var t = sched.trips[svc].filter(function (tr) { return map[tr[0]] !== undefined; }).map(function (tr) { return [map[tr[0]], tr[1]]; });
      if (t.length) trips[svc] = t;
    });
    Object.keys(sched.dates).forEach(function (d) {
      var s = sched.dates[d].filter(function (x) { return trips[x]; });
      if (s.length) dates[d] = s;
    });
    if (sched.routes[cfg.route]) routes[cfg.route] = sched.routes[cfg.route];
    return { v: 1, feed: sched.feed, routes: routes, stops: stops, patterns: patterns, trips: trips, dates: dates };
  }

  function indexSchedule(sched) {
    var byKey = {}, byRD = {}, anyKey = {}, svcDays = {};
    Object.keys(sched.dates).forEach(function (d) {
      var wd = weekday(d);
      sched.dates[d].forEach(function (svc) { (svcDays[svc] = svcDays[svc] || [0, 0, 0, 0, 0, 0, 0])[wd]++; });
    });
    Object.keys(sched.trips).forEach(function (svc) {
      sched.trips[svc].forEach(function (tr) {
        var p = sched.patterns[tr[0]];
        byKey[svc + "|" + p[0] + "|" + p[1] + "|" + tr[1]] = tr[0];
        (byRD[svc + "|" + p[0] + "|" + p[1]] = byRD[svc + "|" + p[0] + "|" + p[1]] || []).push([tr[1], tr[0]]);
        var k = p[0] + "|" + p[1] + "|" + tr[1];
        (anyKey[k] = anyKey[k] || []).push([svc, tr[0]]);
      });
    });
    return { byKey: byKey, byRD: byRD, anyKey: anyKey, svcDays: svcDays };
  }

  // ---------- Protobuf mínimo para GTFS-Realtime ----------
  var S = {};
  function f(name, type, rep) { return [name, type, !!rep]; }
  S.FeedMessage = { 1: f("header", "FeedHeader"), 2: f("entity", "FeedEntity", 1) };
  S.FeedHeader = { 1: f("gtfs_realtime_version", "string"), 2: f("incrementality", "enum"), 3: f("timestamp", "uint") };
  S.FeedEntity = { 1: f("id", "string"), 2: f("is_deleted", "bool"), 3: f("trip_update", "TripUpdate"), 4: f("vehicle", "VehiclePosition"), 5: f("alert", "Alert") };

  $("btn-close").addEventListener("click", function () {
    closeStop(); $("q").focus();
  });
  function closeStop() { state.stop = null; history.replaceState(null, "", location.pathname + location.search); document.title = "Paradas EMTF"; render(); }
  // Enlace a una parada que no existe: se ve en el buscador con su mensaje en vez de no hacer nada.
  function badHash(h) { try { h = decodeURIComponent(h); } catch (e) { /* hash mal codificado */ } $("q").value = h; renderSuggest(); }
  window.addEventListener("hashchange", function () {
    var h = location.hash.slice(1);
    if (byId[h]) selectStop(h, true); else if (!h) closeStop(); else { closeStop(); badHash(h); }
  });
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && (!state.fetchedAt || Date.now() - state.fetchedAt > 10e3)) { refresh(); if (geo.pos) locate(); }
  });

  // Arranque: parada del enlace (#15956) y ubicación si ya diste permiso.
  var h = location.hash.slice(1);
  if (byId[h]) { state.stop = h; }
  else if (h) badHash(h);
  render();
  refresh();
  if (store.get("paradas.geo") === "1") locate();
  else if (navigator.permissions && navigator.permissions.query) {
    navigator.permissions.query({ name: "geolocation" }).then(function (p) { if (p.state === "granted") locate(); }, function () { /* sin API de permisos */ });
  }
  setInterval(function () { if (document.visibilityState !== "hidden") { refresh(); if (geo.pos) locate(); } }, REFRESH_MS);
  setInterval(render, 1000);
})();
</script>
</body>
