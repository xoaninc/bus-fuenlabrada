<style>
/* Buscador arriba, la parada elegida debajo y, al final, las tres más cercanas: como un panel de marquesina por parada. */
:root {
  --bg: #eef1f6;
  --surface: #ffffff;
  --ink: #101a2b;
  --muted: #5a667c;
  --rule: #d8deea;
  --accent: #135fcb;
  --ok: #17803f;
  --late: #a8590a;
  --bad: #b42318;
  --alert-bg: #fff4e5;
  --alert-ink: #6b3a00;
  --font-display: "Barlow Condensed", "Roboto Condensed", "Arial Narrow", sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b111c; --surface: #131c2c; --ink: #e9eef8; --muted: #9aa6bd; --rule: #263248;
    --accent: #5d9bff; --ok: #4cc27a; --late: #f0a94b; --bad: #ff7a6b; --alert-bg: #2a1f10; --alert-ink: #f6d3a2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b111c; --surface: #131c2c; --ink: #e9eef8; --muted: #9aa6bd; --rule: #263248;
  --accent: #5d9bff; --ok: #4cc27a; --late: #f0a94b; --bad: #ff7a6b; --alert-bg: #2a1f10; --alert-ink: #f6d3a2;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 17px/1.45 var(--font-body);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
.wrap {
  max-width: 32rem; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 28px;
  display: flex; flex-direction: column; gap: 14px;
}
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { margin: 0; font: 700 1.9rem/1 var(--font-display); }
h2 { margin: 0; font: 700 1.35rem/1.1 var(--font-display); }
a { color: var(--accent); }
.back { font-weight: 600; text-decoration: none; }
.back:hover { text-decoration: underline; }

.search { position: relative; }
.search label { display: block; font-size: .8rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 4px; }
.search-row { display: flex; gap: 8px; }
input[type="search"] {
  flex: 1; min-width: 0; font: 500 1.1rem var(--font-body); color: var(--ink); background: var(--surface);
  border: 1.5px solid var(--rule); border-radius: 12px; padding: 12px 14px;
}
input[type="search"]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
button {
  font: 600 .95rem/1 var(--font-body); color: var(--accent); background: transparent;
  border: 1.5px solid var(--accent); border-radius: 10px; padding: 10px 14px; cursor: pointer;
}
button:disabled { opacity: .55; cursor: default; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.suggest { list-style: none; margin: 6px 0 0; padding: 0; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; }
.suggest li + li { border-top: 1px solid var(--rule); }
.sug {
  width: 100%; text-align: left; border: 0; border-radius: 0; color: var(--ink); font: 400 1rem/1.3 var(--font-body);
  padding: 11px 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px;
}
.sug b { font-variant-numeric: tabular-nums; }
.sug:hover, .sug:focus-visible { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.sug-lines { display: inline-flex; gap: 4px; }
.sug-to { color: var(--muted); font-size: .9rem; flex-basis: 100%; }

.badge {
  display: inline-grid; place-items: center; min-width: 1.9rem; height: 1.6rem; padding: 0 .35rem; border-radius: 6px;
  font: 700 1rem/1 var(--font-display); flex: none;
}

.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 16px; padding: 14px 16px 10px; display: flex; flex-direction: column; gap: 8px; }
.card.stop { border-top: 6px solid var(--accent); }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.card-head p { margin: 2px 0 0; color: var(--muted); font-size: .95rem; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
.card-head b { color: var(--ink); font-variant-numeric: tabular-nums; }
.close { padding: 6px 10px; font-size: .9rem; flex: none; }

.rows { list-style: none; margin: 0; padding: 0; }
.row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; padding: 9px 0; }
.row + .row { border-top: 1px solid var(--rule); }
.row-main { min-width: 0; display: flex; flex-direction: column; }
.row-dest { font-weight: 600; overflow-wrap: anywhere; }
.row-sub { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
.row-min { font: 700 1.45rem/1 var(--font-display); font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.row-min.now { color: var(--ok); }
.row.dead .row-dest, .row.dead .row-min { text-decoration: line-through; color: var(--muted); }
.st.ok { color: var(--ok); }
.st.late { color: var(--late); }
.st.bad { color: var(--bad); }
.none { color: var(--muted); padding: 10px 0; list-style: none; }

.near-section { display: flex; flex-direction: column; gap: 10px; }
.near-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.near-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.near {
  position: relative; color: var(--ink); background: var(--surface); border: 1px solid var(--rule);
  border-radius: 16px; padding: 12px 16px 6px; display: flex; flex-direction: column; gap: 4px;
}
.near:hover { border-color: var(--accent); }
.near-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.near-name { font: 700 1.2rem/1.15 var(--font-display); overflow-wrap: anywhere; color: var(--ink); background: none; border: 0; border-radius: 0; padding: 0; text-align: left; }
/* Toda la tarjeta es el botón: la capa ::after cubre la tarjeta, así que el clic siempre cae en el botón aunque las filas se repinten. */
.near-name::after { content: ""; position: absolute; inset: 0; border-radius: 16px; }
.near-name:focus-visible { outline: none; }
.near-name:focus-visible::after { outline: 3px solid var(--accent); outline-offset: 2px; }
#stop-lines { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.near-dist { color: var(--accent); font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.near-meta { color: var(--muted); font-size: .9rem; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
.near-meta b { color: var(--ink); }
.msg { margin: 0; color: var(--muted); }

.alert { background: var(--alert-bg); color: var(--alert-ink); border-radius: 12px; padding: 10px 14px; overflow-wrap: anywhere; }
.alert p { margin: 0; }
.alert-h { font-weight: 600; }
.alert-t { font-size: .92rem; }

.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.status { color: var(--muted); font-size: .85rem; margin: 0; min-width: 0; flex: 1 1 12rem; }
.stale { color: var(--late); font-weight: 600; }
.error { margin: 0; border-radius: 12px; padding: 10px 14px; font-size: .92rem; background: var(--surface); border: 1px solid var(--bad); }
.foot { color: var(--muted); font-size: .8rem; margin: 0; }
</style>
</head>

    });
  });
  function norm(s) { return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, " ").trim(); }
  var stops = Object.keys(sched.stops).filter(function (id) { return combos[id]; }).map(function (id) {
    var s = sched.stops[id];
    return { id: id, name: s[0], lat: s[1], lon: s[2], n: norm(s[0]) };
  });
  var byId = {};
  stops.forEach(function (s) { byId[s.id] = s; });
  function routesAt(id) {
    var r = {};
    Object.keys(combos[id] || {}).forEach(function (k) { r[combos[id][k].route] = 1; });
    return Object.keys(r).sort(function (a, b) { return (parseFloat(a) || 999) - (parseFloat(b) || 999); });
  }
  // Destinos de los buses que salen de la parada: distingue las dos aceras con el mismo nombre (15956 → Loranca, 15957 → La Fuente).
  function destsAt(id) {
    var d = {};
    Object.keys(combos[id] || {}).forEach(function (k) { Object.keys(combos[id][k].to).forEach(function (x) { d[x] = 1; }); });
    return Object.keys(d).sort();
  }

  // ---------- Formato ----------
  var fmtHM = new Intl.DateTimeFormat("es-ES", { timeZone: C.TZ, hour: "2-digit", minute: "2-digit" });
  var fmtHMS = new Intl.DateTimeFormat("es-ES", { timeZone: C.TZ, hour: "2-digit", minute: "2-digit", second: "2-digit" });
  function hm(ms) { return fmtHM.format(new Date(ms)); }
  function hmsTxt(ms) { return fmtHMS.format(new Date(ms)); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function title(s) {
    var small = { de: 1, del: 1, la: 1, las: 1, el: 1, los: 1, y: 1 };
    return String(s || "").toLowerCase().split(/(\s+|-)/).map(function (w, i) {
      return i > 0 && small[w] ? w : w.charAt(0).toUpperCase() + w.slice(1);
    }).join("");
  }
  function minsLeft(ms) {
    var diff = ms - now();
    if (diff <= 30e3) return null;
    return Math.max(1, Math.floor(ms / 60000) - Math.floor(now() / 60000));
  }
  function distTxt(m) { return m < 1000 ? Math.round(m / 10) * 10 + " m" : (m / 1000).toFixed(1).replace(".", ",") + " km"; }
  function dist(a, b) {
    var k = Math.PI / 180, x = (b[1] - a[1]) * k * Math.cos((a[0] + b[0]) / 2 * k), y = (b[0] - a[0]) * k;
    return Math.sqrt(x * x + y * y) * 6371000;
  }
  function lum(hex) {
    var c = [0, 2, 4].map(function (i) {
      var v = parseInt(hex.substr(i, 2), 16) / 255;
      return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  }
  // Distintivo de línea con su color de EMTF y el texto (blanco o negro) que más contraste da.
  function badge(route) {
    var r = sched.routes[route] || [route, "", ""];
    var bg = /^[0-9a-f]{6}$/i.test(r[2] || "") ? r[2] : "135FCB", L = lum(bg);
    var fg = (L + 0.05) / 0.05 > 1.05 / (L + 0.05) ? "#000000" : "#ffffff";
    return '<span class="badge" style="background:#' + bg + ";color:" + fg + '">' + esc(r[0]) + "</span>";
  }

  // ---------- Llegadas ----------
  function arrivalsAt(stopId, t) {
    var out = [];
    Object.keys(combos[stopId] || {}).forEach(function (k) {
      var c = combos[stopId][k];
      C.computeArrivals(sched, idx, state.feeds || {}, { route: c.route, dir: c.dir, stop: stopId, boardingOnly: true }, t).forEach(function (a) {
        a.route = c.route; out.push(a);
      });
    });
    return out.sort(function (a, b) { return (a.etaMs != null ? a.etaMs : a.schedMs) - (b.etaMs != null ? b.etaMs : b.schedMs); });
  }
  function alertsAt(stopId, t) {
    if (!state.feeds) return [];
    var seen = {}, out = [];
    routesAt(stopId).forEach(function (r) {
      C.alertsFor(sched, state.feeds, { route: r, dir: 0, stop: stopId }, t).forEach(function (a) {
        if (!seen[a.header + a.text]) { seen[a.header + a.text] = 1; out.push(a); }
      });
    });
    return out;
  }
  function statusOf(a) {
    if (a.canceled) return { cls: "bad", txt: "Cancelado" };
    if (a.skipped) return { cls: "bad", txt: "No para aquí" };
    if (a.added) return { cls: "ok", txt: "Refuerzo" };
    if (a.source === "sched") return { cls: "muted", txt: "Según horario" };
    if (a.predMs == null) return { cls: "muted", txt: "Sin predicción" };
    var d = Math.round((a.predMs - a.schedMs) / 60000);
    if (d === 0) return { cls: "ok", txt: "En hora" };
    return d < 0 ? { cls: "ok", txt: -d + " min adelantado" } : { cls: "late", txt: d + " min de retraso" };
  }
  function rowHtml(a) {
    var s = statusOf(a), dead = a.canceled || a.skipped;
    var here = a.pos && a.pos.stopsLeft === 0 && a.pos.atStop;
    var m = dead ? null : here ? null : minsLeft(a.etaMs);
    var big = dead ? "—" : m == null ? (a.source === "sched" ? "Ahora" : "Llegando") : m + " min";
    var where = "";
    if (a.pos && !dead) where = a.pos.stopsLeft === 0 ? (a.pos.atStop ? "En la parada" : "Llegando a la parada") : (a.pos.stopsLeft === 1 ? "a 1 parada" : "a " + a.pos.stopsLeft + " paradas");
    return '<li class="row' + (dead ? " dead" : "") + '">' + badge(a.route) +
      '<span class="row-main"><span class="row-dest">' + esc(title(a.headsign || "")) + "</span>" +
      '<span class="row-sub">' + (dead ? hm(a.schedMs) : hm(a.etaMs)) + ' · <span class="st ' + s.cls + '">' + esc(s.txt) + "</span>" + (where ? " · " + where : "") + "</span></span>" +
      '<span class="row-min' + (m == null && !dead ? " now" : "") + '">' + big + "</span></li>";
  }

  // ---------- Pintado ----------
  function renderStop(t) {
    var box = $("stop");
    if (!state.stop || !byId[state.stop]) { box.hidden = true; return; }
    var s = byId[state.stop], list = arrivalsAt(s.id, t).slice(0, 8), al = alertsAt(s.id, t);
    box.hidden = false;
    $("stop-name").textContent = s.name;
    $("stop-code").textContent = s.id;
    $("stop-lines").innerHTML = routesAt(s.id).map(badge).join("");
    $("stop-list").innerHTML = list.length ? list.map(rowHtml).join("")
      : '<li class="none">' + (state.feeds || state.error ? "No pasa ningún bus en las próximas 3 horas." : "Cargando…") + "</li>";
    $("stop-alerts").innerHTML = al.map(function (x) {
      return '<div class="alert"><p class="alert-h">' + esc(x.header) + "</p>" + (x.text ? '<p class="alert-t">' + esc(x.text) + "</p>" : "") + "</div>";
    }).join("");
    document.title = s.name + " · Paradas EMTF";
  }
  function renderNear(t) {
    var box = $("near-list"), msg = $("near-msg"), btn = $("btn-locate");
    btn.textContent = geo.pos ? "Actualizar ubicación" : "Usar mi ubicación";
    btn.disabled = geo.busy;
    if (geo.busy && !geo.pos) { msg.textContent = "Buscando tu ubicación…"; msg.hidden = false; }
    else if (geo.error) { msg.textContent = geo.error; msg.hidden = false; }
    else if (!geo.pos) { msg.textContent = "Activa la ubicación para ver las 3 paradas más cercanas."; msg.hidden = false; }
    else msg.hidden = true;
    if (!geo.pos) { if (box._ids) { box.innerHTML = ""; box._ids = ""; } return; }
    var near = stops.map(function (s) { return { s: s, d: dist(geo.pos, [s.lat, s.lon]) }; })
      .sort(function (a, b) { return a.d - b.d; }).slice(0, 3);
    if (near[0].d > 3000) { msg.textContent = "Estás a " + distTxt(near[0].d) + " de la parada de EMT Fuenlabrada más cercana."; msg.hidden = false; }
    // La tarjeta (y su botón) solo se crea cuando cambian las paradas: así no se pierde el foco ni el clic al repintar cada segundo.
    var ids = near.map(function (n) { return n.s.id; }).join(",");
    if (box._ids !== ids) {
      box._ids = ids;
      box.innerHTML = near.map(function (n) {
        return '<li class="near"><span class="near-head"><button type="button" class="near-name" data-stop="' + esc(n.s.id) + '">' + esc(n.s.name) + '</button><span class="near-dist"></span></span>' +
          '<span class="near-meta">Parada <b>' + esc(n.s.id) + "</b> " + routesAt(n.s.id).map(badge).join("") + "</span>" +
          '<ul class="rows"></ul></li>';
      }).join("");
    }
    near.forEach(function (n, i) {
      var li = box.children[i];
      var list = arrivalsAt(n.s.id, t).filter(function (a) { return !a.canceled && !a.skipped; }).slice(0, 3);
      setText(li.querySelector(".near-dist"), distTxt(n.d));
      setHtml(li.querySelector(".rows"), list.length ? list.map(rowHtml).join("") : '<li class="none">' + (state.feeds || state.error ? "Sin buses en las próximas 3 horas" : "Cargando…") + "</li>");
    });
  }
  function setHtml(el, html) { if (el._h !== html) { el.innerHTML = html; el._h = html; } }
  function setText(el, s) { if (el.textContent !== s) el.textContent = s; }
  function renderStatus(t) {
    var parts = [];
    if (state.loading) parts.push("Actualizando…");
    var ts = state.feeds && state.feeds.tu && state.feeds.tu.header && state.feeds.tu.header.timestamp;
    if (ts) {
      var age = Math.round((t - ts * 1000) / 1000);
      parts.push("Datos de las " + hmsTxt(ts * 1000) + (age > 180 ? ' <span class="stale">(' + (age < 3600 ? "hace " + Math.round(age / 60) + " min" : "hace más de una hora") + ")</span>" : ""));
    } else if (state.feeds && state.fetchedAt) parts.push("Datos recibidos a las " + hmsTxt(state.fetchedAt + clockOffset));
    $("status").innerHTML = parts.join(" · ") || (state.error ? "Sin datos en directo" : "Descargando datos en directo…");
    $("error").hidden = !state.error;
    if (state.error) {
      var e = state.error;
      $("error").textContent = (e && e.name === "AbortError" ? "El servidor de datos en directo no responde."
        : /servidor respondió|respuesta vacía|protobuf|cable/.test(String(e && e.message)) ? "El servidor de EMT no está dando datos en directo ahora mismo."
        : "No he podido descargar los datos en directo. Comprueba la conexión.") + (state.feeds ? " Muestro los últimos que tengo." : " Mientras tanto ves el horario.");
    }
  }
  function render() { var t = now(); renderStop(t); renderNear(t); renderStatus(t); }

  // ---------- Buscador ----------
  function search(q) {
    var n = norm(q);
    if (!n) return [];
    if (/^\d+$/.test(n)) {
      return stops.filter(function (s) { return s.id.indexOf(n) === 0; })
        .sort(function (a, b) { return (a.id === n ? -1 : 0) - (b.id === n ? -1 : 0) || a.id.length - b.id.length || a.id.localeCompare(b.id); });
    }
    var words = n.split(" ");
    return stops.filter(function (s) { return words.every(function (w) { return s.n.indexOf(w) >= 0; }); })
      .sort(function (a, b) { return a.n.indexOf(words[0]) - b.n.indexOf(words[0]) || a.name.localeCompare(b.name); });
  }
  function renderSuggest() {
    var q = $("q").value, res = search(q).slice(0, 8), box = $("suggest");
    if (!q.trim()) { box.hidden = true; box.innerHTML = ""; return; }
    box.hidden = false;
    box.innerHTML = res.length ? res.map(function (s) {
      return '<li><button type="button" class="sug" data-stop="' + esc(s.id) + '"><b>' + esc(s.id) + "</b> " + esc(s.name) +
        ' <span class="sug-lines">' + routesAt(s.id).map(badge).join("") + '</span><span class="sug-to">→ ' + esc(destsAt(s.id).join(", ")) + "</span></button></li>";
    }).join("") : '<li class="none">' + noneMsg(q.trim()) + "</li>";
  }
  function noneMsg(q) {
    var s = sched.stops[q];
    if (s) return "La parada " + esc(q) + " (" + esc(s[0]) + ") es final de línea: ahí no se sube a ningún bus.";
    return "No hay ninguna parada con «" + esc(q) + "».";
  }
  function selectStop(id, fromHash) {
    if (!byId[id]) return;
    state.stop = id;
    store.set("paradas.last", id);
    if (!fromHash && location.hash !== "#" + id) history.replaceState(null, "", "#" + id);
    var lost = !document.activeElement || document.activeElement === document.body || $("suggest").contains(document.activeElement);
    $("q").value = ""; renderSuggest();
    render();
    $("stop").scrollIntoView({ behavior: "smooth", block: "start" });
    if (lost || document.activeElement === document.body) $("stop-name").focus({ preventScroll: true });
  }

  // ---------- Ubicación ----------
  function locate() {
    if (!navigator.geolocation) { geo.error = "Este navegador no da la ubicación."; render(); return; }
    geo.busy = true; geo.error = null; render();
    navigator.geolocation.getCurrentPosition(function (p) {
      geo.busy = false; geo.pos = [p.coords.latitude, p.coords.longitude]; geo.acc = p.coords.accuracy;
      store.set("paradas.geo", "1"); render();
    }, function (e) {
      geo.busy = false;
      geo.error = e.code === 1 ? "No tengo permiso para ver tu ubicación. En el iPhone: Ajustes → Privacidad → Localización → Safari → «Mientras se usa la app»."
        : "No he podido saber dónde estás. Prueba otra vez.";
      render();
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 });
  }

  // ---------- Descarga ----------
  function getFeed(url) {
    var ac = typeof AbortController !== "undefined" ? new AbortController() : null;
    var timer = ac ? setTimeout(function () { ac.abort(); }, 15000) : null;
    return fetch(url, ac ? { cache: "no-store", signal: ac.signal } : { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("el servidor respondió " + r.status);
      return r.arrayBuffer();
    }).then(function (b) {
      var feed = C.decodeFeed(new Uint8Array(b));
      if (!feed.header) throw new Error("respuesta vacía");
      return feed;
    }).then(function (f) { clearTimeout(timer); return f; }, function (e) { clearTimeout(timer); throw e; });
  }
  function refresh() {
    if (state.loading && Date.now() - state.loadingSince < 20000) return;
    state.loading = true; state.loadingSince = Date.now(); renderStatus(now());
    Promise.all([getFeed(FEEDS.tu), getFeed(FEEDS.vp).catch(function () { return null; }), getFeed(FEEDS.al).catch(function () { return null; })])
      .then(function (r) { state.feeds = { tu: r[0], vp: r[1], al: r[2] }; state.fetchedAt = Date.now(); state.error = null; })
      .catch(function (e) { state.error = e; })
      .then(function () { state.loading = false; render(); });
  }

  // ---------- Eventos ----------
  $("q").addEventListener("input", renderSuggest);
  $("search").addEventListener("submit", function (e) {
    e.preventDefault();
    var res = search($("q").value);
    if (res.length) selectStop(res[0].id);
  });
  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest("[data-stop]");
    if (b) selectStop(b.getAttribute("data-stop"));
  });
  $("btn-locate").addEventListener("click", locate);
  $("btn-refresh").addEventListener("click", function () { refresh(); if (geo.pos) locate(); });
  $("btn-close").addEventListener("click", function () {
    closeStop(); $("q").focus();
  });
  function closeStop() { state.stop = null; history.replaceState(null, "", location.pathname + location.search); document.title = "Paradas EMTF"; render(); }
  // Enlace a una parada que no existe: se ve en el buscador con su mensaje en vez de no hacer nada.
  function badHash(h) { try { h = decodeURIComponent(h); } catch (e) { /* hash mal codificado */ } $("q").value = h; renderSuggest(); }
  window.addEventListener("hashchange", function () {
    var h = location.hash.slice(1);
    if (byId[h]) selectStop(h, true); else if (!h) closeStop(); else { closeStop(); badHash(h); }
  });
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && (!state.fetchedAt || Date.now() - state.fetchedAt > 10e3)) { refresh(); if (geo.pos) locate(); }
  });

  // Arranque: parada del enlace (#15956) y ubicación si ya diste permiso.
  var h = location.hash.slice(1);
  if (byId[h]) { state.stop = h; }
  else if (h) badHash(h);
  render();
  refresh();
  if (store.get("paradas.geo") === "1") locate();
  else if (navigator.permissions && navigator.permissions.query) {
    navigator.permissions.query({ name: "geolocation" }).then(function (p) { if (p.state === "granted") locate(); }, function () { /* sin API de permisos */ });
  }
  setInterval(function () { if (document.visibilityState !== "hidden") { refresh(); if (geo.pos) locate(); } }, REFRESH_MS);
  setInterval(render, 1000);
})();
</script>
</body>
</html>
